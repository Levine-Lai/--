<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020b2d" />
    <title>企鹅欧冠 Fantasy 联赛</title>
    <link rel="stylesheet" href="./dashboard.css?v=20260907-1" />
  </head>
  <body>
    <main class="league-shell">
      <header class="site-header">
        <div class="header-copy">
          <img class="brand-mascot" src="./assets/title-mascot.png" alt="" aria-hidden="true" />
          <div>
            <p class="season-label">2026/27 UEFA CHAMPIONS LEAGUE</p>
            <h1>企鹅欧冠 Fantasy 联赛</h1>
          </div>
        </div>
        <div class="region-switch" role="group" aria-label="赛区切换">
          <button class="region-button is-active" type="button" data-region="arctic">Shuo🐧北极赛区</button>
          <button class="region-button" type="button" data-region="antarctic">小红书关注Acidboy🐧南极赛区</button>
        </div>
      </header>

      <nav class="main-nav" aria-label="联赛页面">
        <button class="nav-button is-active" type="button" data-view="matches"><span>对阵详情</span><small>8 轮比赛</small></button>
        <button class="nav-button" type="button" data-view="standings"><span>实时积分榜</span><small>胜 3 · 平 1 · 负 0</small></button>
        <button class="nav-button" type="button" data-view="groups"><span>分组详情</span><small>四档 36 队</small></button>
      </nav>

      <section class="page-view is-active" id="matchesView" data-view-panel="matches">
        <div class="section-heading">
          <div><p class="section-kicker" id="matchesRegionLabel"></p><h2>对阵详情</h2></div>
          <span class="sync-status"><i></i> 等待官方 API</span>
        </div>
        <div class="round-tabs" id="roundTabs" role="tablist" aria-label="比赛轮次"></div>
        <div class="round-summary">
          <div><strong id="roundTitle">第 1 轮</strong><span id="roundDates"></span></div><span>18 场比赛</span>
        </div>
        <div class="match-grid" id="matchGrid"></div>
      </section>

      <section class="page-view" id="standingsView" data-view-panel="standings" hidden>
        <div class="section-heading">
          <div><p class="section-kicker" id="standingsRegionLabel"></p><h2>实时积分榜</h2></div>
          <span class="points-rule">胜 3 分 · 平 1 分 · 负 0 分</span>
        </div>
        <div class="table-card">
          <table class="standings-table">
            <thead><tr><th>排名</th><th>球队 / 经理人</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>得分</th><th>失分</th><th>净胜</th><th>积分</th></tr></thead>
            <tbody id="standingsBody"></tbody>
          </table>
        </div>
      </section>

      <section class="page-view" id="groupsView" data-view-panel="groups" hidden>
        <div class="section-heading">
          <div><p class="section-kicker" id="groupsRegionLabel"></p><h2>分组详情</h2></div>
          <span class="assignment-count">36 支球队 · 36 位经理人</span>
        </div>
        <div class="pot-grid" id="potGrid"></div>
      </section>
    </main>

    <div class="modal-backdrop" id="matchModal" hidden>
      <section class="match-modal" role="dialog" aria-modal="true" aria-labelledby="modalMatchTitle">
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
        <div id="modalContent"></div>
      </section>
    </div>

    <script src="./ucl-app.js?v=20260907-data"></script>
    <script src="./dashboard.js?v=20260907-1"></script>
  </body>
</html>
