<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>企鹅欧冠 Fantasy 球队抽签</title>
    <link rel="stylesheet" href="./styles.css?v=20260905-official2" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <div class="brand-title">
            <img class="title-mascot" src="./assets/title-mascot.png" alt="" aria-hidden="true" />
            <div>
              <p class="eyebrow">2026/27 UEFA CHAMPIONS LEAGUE</p>
              <h1>企鹅欧冠 Fantasy 球队抽签</h1>
            </div>
          </div>
        </div>
        <div class="top-actions">
          <div class="stage-pill" id="stagePill">Pot 1 · 1/9</div>
          <div class="counter"><span id="drawCount">0</span><small>/36</small></div>
          <div class="export-actions" id="exportActions" hidden>
            <button class="soft-btn export-image-btn" id="exportDrawBtn" type="button">导出抽签结果</button>
            <button class="soft-btn export-image-btn" id="exportScheduleBtn" type="button">导出对阵</button>
          </div>
        </div>
      </header>

      <section class="workspace">
        <section class="draw-panel" id="drawPanel" aria-label="抽签机器">
          <div class="region-switch" id="regionSwitch" aria-label="南北极赛区切换"></div>
          <div class="machine-meta"><strong id="nextTeamLabel">Pot 1 · 巴黎圣日耳曼</strong></div>
          <div class="machine" id="machine">
            <canvas
              class="machine-canvas"
              id="machineCanvas"
              width="640"
              height="640"
              aria-label="玻璃抽签机动画"
            ></canvas>
          </div>

          <div class="controls">
            <button class="primary-btn draw-button" id="startBtn" type="button">抽签</button>
            <div class="secondary-controls">
              <button class="soft-btn" id="autoBtn" type="button">直接生成名单</button>
              <button class="soft-btn danger" id="resetBtn" type="button">重置</button>
            </div>
          </div>
        </section>

        <section class="groups-panel" aria-label="欧冠四档球队与经理人对应情况">
          <div class="pots-intro">
            <div>
              <h2>欧冠联赛阶段</h2>
            </div>
          </div>
          <div class="groups-grid" id="groupsGrid"></div>
        </section>
      </section>

      <section class="player-pool" aria-label="经理人分档">
        <div class="pool-head">
          <div>
            <h2>经理人分档</h2>
          </div>
          <span id="remainingCount">36 人</span>
        </div>
        <div class="pool-scroll" id="playerPool"></div>
      </section>

      <section class="fixtures-panel" id="fixturesPanel" aria-label="完整对阵" hidden>
        <div class="fixtures-head">
          <h2>完整对阵</h2>
          <span id="fixturesRegion"></span>
        </div>
        <div class="fixtures-scroll">
          <table class="fixtures-table">
            <thead>
              <tr>
                <th scope="col">经理人 / 球队</th>
                <th scope="col">第 1 轮</th>
                <th scope="col">第 2 轮</th>
                <th scope="col">第 3 轮</th>
                <th scope="col">第 4 轮</th>
                <th scope="col">第 5 轮</th>
                <th scope="col">第 6 轮</th>
                <th scope="col">第 7 轮</th>
                <th scope="col">第 8 轮</th>
              </tr>
            </thead>
            <tbody id="fixturesBody"></tbody>
          </table>
        </div>
      </section>

      <section class="schedules-panel" id="schedulesPanel" aria-label="各队赛程" hidden>
        <div class="schedules-head">
          <h2>各队赛程</h2>
          <span id="schedulesRegion"></span>
        </div>
        <div class="schedule-list" id="scheduleList"></div>
      </section>
    </main>

    <div class="modal-backdrop" id="resultModal" hidden>
      <section class="result-modal draw-paper-modal" role="dialog" aria-modal="true" aria-labelledby="modalText">
        <button class="close-btn" id="closeModalBtn" type="button" aria-label="关闭">×</button>
        <div class="draw-paper-header" aria-hidden="true">
          <img src="./assets/ucl-draw-header.jpg?v=20260831-1" alt="" />
        </div>
        <p class="draw-paper-body" id="modalText"></p>
      </section>
    </div>

    <div class="modal-backdrop" id="autoModal" hidden>
      <section class="result-modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="autoTitle">
        <h2 id="autoTitle">确认直接生成名单？</h2>
        <p>剩余球队将立即随机匹配经理人。</p>
        <div class="confirm-actions">
          <button class="soft-btn" id="cancelAutoBtn" type="button">取消</button>
          <button class="soft-btn danger" id="confirmAutoBtn" type="button">确认生成</button>
        </div>
      </section>
    </div>

    <div class="modal-backdrop" id="resetModal" hidden>
      <section class="result-modal confirm-modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
        <h2 id="resetTitle">确认重置？</h2>
        <p>当前赛区的抽签和对阵结果会被清空。</p>
        <div class="confirm-actions">
          <button class="soft-btn" id="cancelResetBtn" type="button">取消</button>
          <button class="soft-btn danger" id="confirmResetBtn" type="button">确认重置</button>
        </div>
      </section>
    </div>

    <script src="./ucl-app.js?v=20260905-official2"></script>
  </body>
</html>
